name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (debug)
        run: cargo test --all-targets
      - name: Test (release, including the 320 MB large buffer test)
        run: cargo test --release -- --include-ignored
      - name: Example
        run: cargo run --release --example packet

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Clippy (pedantic, via [lints] in Cargo.toml)
        run: cargo clippy --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --check
      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Zero dependencies
        run: test "$(cargo tree --edges normal --prefix none | wc -l)" -eq 1

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - name: Check with the minimum supported Rust version
        run: cargo check --all-targets

  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # The conformance runner discovers conformance/ at run time rather than embedding a
      # hand written file list, so it needs a filesystem. Miri refuses read_dir under its
      # default isolation, which would fail the corpus test for a reason that is nothing to
      # do with undefined behaviour, the only thing this job exists to find.
      - name: Test under Miri (differential seeds reduced via cfg(miri))
        run: cargo miri test
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

  fuzz:
    name: fuzz smoke (60s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2.87.0
        with:
          tool: cargo-fuzz
      # the prebuilt cargo-fuzz is musl-static and would default the fuzz build to the musl
      # target, where the address sanitizer cannot link — pin the real host triple
      - name: Fuzz hostile_read
        run: cargo +nightly fuzz run hostile_read --target x86_64-unknown-linux-gnu -- -max_total_time=60
      - name: Fuzz round_trip
        run: cargo +nightly fuzz run round_trip --target x86_64-unknown-linux-gnu -- -max_total_time=60
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  cpp-interop:
    name: C++ wire compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out the C++ serialize library (pinned release)
        uses: actions/checkout@v7
        with:
          # THE FAMILY PIN -- ONE POLICY, ONE VERSION. The C++ checkout is pinned to the
          # latest RELEASED tag of mas-bandwidth/serialize, never main, and to the SAME
          # tag in all four wire-compat gates, so "compatible with C++" means the same
          # thing in every port. Never main, because an upstream merge mid-day must not
          # change what a commit's CI proves -- the sibling-HEAD race broke family gates
          # three separate times (2026-08-16/17). Find the newest tag with:
          #   gh release list --repo mas-bandwidth/serialize --limit 1
          # Bump family-wide, deliberately, in its own commit per repo, and only
          # alongside the byte-identity check this gate runs.
          #
          # THE FLOOR, which is why the tag can never simply go backwards: the
          # harness's extended sequence carries a degenerate 64 bit range
          # (min == max), round trippable since v1.6.2; v1.7.0 pinned
          # serialize_compressed_float to float32 double rounding (no FMA
          # contraction), which the between-quanta values discriminate;
          # v1.11.0 is the first release carrying
          # serialize_compressed_float_precomputed, which golden.cpp drives;
          # and v1.12.0 is the first release carrying the normative integer
          # clamp (STANDARD.md, schema#109), which the harness's two clamp
          # witnesses make load-bearing -- against an older header those rows
          # go red, the cross-language proof serialize#94 found missing.
          repository: mas-bandwidth/serialize
          ref: v1.16.2
          path: cpp-serialize
      - uses: dtolnay/rust-toolchain@stable
      # no -DNDEBUG on purpose: serialize_assert stays live, so the degenerate
      # ranges must pass with the C++ library's own checks enabled rather than
      # around them. No -ffp-contract=off either: v1.7.0 pins the compressed
      # float arithmetic in source, and building with default flags proves the
      # library's fix instead of masking it.
      - name: Build the C++ golden harness against the real library
        run: g++ -O2 -std=c++17 -I cpp-serialize interop/golden.cpp -o cpp_golden
      - name: Both implementations write byte-identical wire data
        run: |
          ./cpp_golden write cpp.bin
          cargo run --release --example wire_interop -- write rust.bin
          cmp cpp.bin rust.bin
      - name: Each implementation decodes the other's bytes
        run: |
          cargo run --release --example wire_interop -- read cpp.bin
          ./cpp_golden read rust.bin

  cross-targets:
    # s390x is big endian (proves the wire format is endian independent); i686 is 32 bit
    # (covers the usize arithmetic the way the Go port's linux/386 job covers 32 bit int)
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [s390x-unknown-linux-gnu, i686-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.87.0
        with:
          tool: cross
      - name: Test under qemu
        run: cross test --release --target ${{ matrix.target }}

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check the library builds for wasm
        run: cargo check --target wasm32-unknown-unknown

  semver:
    name: semver (API compatibility vs main)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.87.0
        with:
          tool: cargo-semver-checks
      # cargo-semver-checks pairs the baseline package with the current one BY
      # PACKAGE NAME, so a package rename would blind this gate for exactly the
      # PR that renames. Rather than skip, resolve the baseline by lib target:
      # both sides build a lib named `serialize`, so we check out the baseline,
      # normalize only its [package] name, and run the real API comparison via
      # --baseline-root. The one recognized rename is serialize ->
      # serialize-official (2026-08-26, PR #63; the bare name is reserved on
      # crates.io). Any OTHER name mismatch fails loudly so the gate stays
      # armed. Once main carries serialize-official the rename branch is dead
      # code and can be removed.
      - name: Check API compatibility against main
        run: |
          current_name=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -1)
          baseline_name=$(git show origin/main:Cargo.toml | sed -n 's/^name = "\(.*\)"/\1/p' | head -1)
          if [ "$current_name" = "$baseline_name" ]; then
            cargo semver-checks check-release --baseline-rev origin/main
          elif [ "$baseline_name" = "serialize" ] && [ "$current_name" = "serialize-official" ]; then
            echo "::notice::baseline package is 'serialize', current is 'serialize-official' (the 2026-08-26 rename); comparing the identical lib target by normalizing the baseline package name"
            baseline_dir=$(mktemp -d)
            git worktree add --detach "$baseline_dir" origin/main
            sed -i.bak "0,/^name = \"serialize\"/s//name = \"serialize-official\"/" "$baseline_dir/Cargo.toml"
            rm "$baseline_dir/Cargo.toml.bak"
            # the baseline has no [lib] section, so its lib target name follows the
            # package name; pin it back to `serialize` so both sides build the same
            # lib target and the comparison sees the API, not the rename
            printf '\n[lib]\nname = "serialize"\n' >> "$baseline_dir/Cargo.toml"
            cargo semver-checks check-release --baseline-root "$baseline_dir"
          else
            echo "::error::package name changed from '$baseline_name' (main) to '$current_name'; cargo-semver-checks cannot pair packages across a rename by name — handle this rename deliberately in the semver job"
            exit 1
          fi

  spec-sync:
    name: STANDARD.md and conformance/ match upstream
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # STANDARD.md and conformance/ here are VERBATIM VENDORED COPIES of the
      # wire-format specification and the shared conformance corpus that live in
      # mas-bandwidth/serialize. This job fails if either has diverged.
      #
      # Why vendor rather than link: an implementer wants the normative text and
      # the vectors that test it beside the implementation, at the revision they
      # are reading. Why check: a duplicated normative document is the same
      # failure as a duplicated constant, except it drifts silently and the ports
      # are what break. The corpus is the conformance instrument (STANDARD.md,
      # Provenance) -- every implementation vendors it and runs every vector,
      # rather than regenerating expectations it already agrees with.
      #
      # If this fails, upstream changed. Read the diff, port whatever it implies,
      # then copy the new files across in the same commit. A NEW vector file needs
      # no edit to tests/conformance.rs: the runner discovers the directory. It
      # does need a dispatch arm for a new OPERATION, and the runner fails on a
      # vector it cannot dispatch, because an operation nothing runs is an
      # untested rule rather than a pass.
      - name: Compare against mas-bandwidth/serialize
        run: |
          git clone --quiet --depth 1 https://github.com/mas-bandwidth/serialize.git /tmp/upstream
          echo "upstream: mas-bandwidth/serialize@$(git -C /tmp/upstream rev-parse HEAD)"
          status=0
          if ! diff -u /tmp/upstream/STANDARD.md STANDARD.md; then
            echo "::error::STANDARD.md has diverged from mas-bandwidth/serialize"
            status=1
          fi
          if ! diff -ru /tmp/upstream/conformance conformance; then
            echo "::error::conformance/ has diverged from mas-bandwidth/serialize"
            status=1
          fi
          test "$status" -eq 0
          echo "STANDARD.md and conformance/ match upstream"

  # Version agreement inside the repository cannot see the failure that matters here: a
  # release tagged and never published. crates.io is where consumers get this crate, so the
  # newest version in its index is the only version that exists as far as they are concerned,
  # and the repository can run ahead of it indefinitely with every in-repo check green. That
  # is the state this job was written in: the index held 2.2.2 while the repository was at
  # 2.3.0, and nothing said so.
  #
  # On main and on a pull request this reports, because publishing is not part of merging.
  # On a release tag it gates, because a tag is a claim that a release exists: at most ONE
  # release may be in flight, the one the tag names, and a second unpublished tag behind it
  # means an earlier release was never published.
  published-version:
    name: published version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # every v* tag: the drift is counted in tags, not in commits

      - name: Compare the manifest against the crates.io index
        run: |
          set -u

          crate=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -1)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$crate" ] || [ -z "$version" ]; then
            echo "::error::could not read name and version out of Cargo.toml"
            exit 1
          fi
          echo "crate:      $crate"
          echo "manifest:   $version"

          # the sparse index path: 1/, 2/, 3/<first letter>/, then <first two>/<next two>/
          lower=$(printf '%s' "$crate" | tr '[:upper:]' '[:lower:]')
          case ${#lower} in
            1) path="1/$lower" ;;
            2) path="2/$lower" ;;
            3) path="3/$(printf '%s' "$lower" | cut -c1)/$lower" ;;
            *) path="$(printf '%s' "$lower" | cut -c1-2)/$(printf '%s' "$lower" | cut -c3-4)/$lower" ;;
          esac

          published=""
          if curl -sS -f "https://index.crates.io/$path" -o /tmp/index.json; then
            published=$(jq -r 'select(.yanked | not) | .vers' /tmp/index.json | sort -V | tail -n1)
          fi
          if [ -z "$published" ]; then
            echo "published:  nothing (the index holds no unyanked version of $crate)"
          else
            echo "published:  $published"
          fi

          # every release tag whose version is ahead of what crates.io holds
          unpublished=""
          for tag in $(git tag --list 'v*' --sort=v:refname); do
            tag_version="${tag#v}"
            if [ -z "$published" ]; then
              unpublished="$unpublished $tag"
            elif [ "$tag_version" != "$published" ] && \
                 [ "$(printf '%s\n%s\n' "$published" "$tag_version" | sort -V | tail -n1)" = "$tag_version" ]; then
              unpublished="$unpublished $tag"
            fi
          done
          unpublished="${unpublished# }"
          count=0
          [ -n "$unpublished" ] && count=$(printf '%s\n' $unpublished | wc -l | tr -d ' ')

          {
            echo "## Published version"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| crate | \`$crate\` |"
            echo "| manifest | \`$version\` |"
            echo "| newest on crates.io | \`${published:-none}\` |"
            echo "| tagged and unpublished | ${unpublished:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"

          case "$GITHUB_REF" in
            refs/tags/v*)
              tag_version="${GITHUB_REF_NAME#v}"
              if [ "$tag_version" != "$version" ]; then
                echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml. Bump the manifest as part of the release"
                exit 1
              fi
              if [ "$count" -gt 1 ]; then
                echo "::error::$count tagged releases are ahead of crates.io ($unpublished), and the newest on crates.io is ${published:-none}. Only the release this tag names may be in flight. Publish the earlier one(s) first."
                exit 1
              fi
              echo "$GITHUB_REF_NAME is the only release in flight."
              ;;
            *)
              if [ "$version" = "$published" ]; then
                echo "the manifest matches crates.io."
              elif [ "$count" -ge 1 ]; then
                echo "::warning::$count tagged release(s) are ahead of crates.io ($unpublished). The manifest is $version and crates.io holds ${published:-none}: a release is owed."
              else
                echo "::notice::the manifest is $version and crates.io holds ${published:-none}. That is the release in flight, not drift."
              fi
              ;;
          esac

[package]
name = "serialize-official"
version = "2.2.2"
edition = "2024"
rust-version = "1.85"
description = "A simple bitpacking serializer for Rust, wire compatible with the C++ serialize library"
repository = "https://github.com/mas-bandwidth/serialize.rs"
license = "BSD-3-Clause"
keywords = ["serialization", "bitpacking", "networking", "gamedev"]
categories = ["game-development", "network-programming", "encoding"]
# repo infrastructure that does not belong in the crates.io package; the fuzz/ crate is
# excluded automatically as a nested package
exclude = [".github/", "interop/", "CLAUDE.md"]

# The package publishes as serialize-official (the bare name is reserved on
# crates.io); the library keeps its own name, so code says `use serialize::`.
[lib]
name = "serialize"

[dependencies]

[[bench]]
name = "throughput"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# deliberate port style: this is a bit-level codec and narrowing/sign casts are pervasive and
# intentional, mirroring the C++ library (which disables the equivalent warnings)
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
# ReadStream lives in read_stream.rs, matching the Go port's layout
module_name_repetitions = "allow"
# the hot serialize spine (ReadStream::serialize_bits, the thin fallible wrappers,
# WriteStream::serialize_bits, BitWriter::write_bits/flush_bits) is #[inline(always)]
# on measurement, not hope: at plain #[inline] strength LLVM's cold-callsite
# classification strands these calls out of line partway down long serialize
# functions — reads ran 1.8-2.6x behind the C++ library, and generated writers past
# a fallible field stranded write_bits at cost 225 against the cold threshold 45
# (schema bench, Apple M2); each attribute carries a bench-verified delta
inline_always = "allow"
# test values are copied verbatim from the C++ test suite so the suites stay diffable;
# inserting separators would defeat that
unreadable_literal = "allow"

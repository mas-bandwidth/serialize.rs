[package]
name = "serialize-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The parent package publishes as serialize-official; the dependency key keeps the
# crate name `serialize`, matching the lib target, so fuzz targets stay unchanged.
serialize = { package = "serialize-official", path = ".." }

[[bin]]
name = "hostile_read"
path = "fuzz_targets/hostile_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "round_trip"
path = "fuzz_targets/round_trip.rs"
test = false
doc = false
bench = false

[workspace]
